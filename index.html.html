<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Laporan Brandon: Faiq & Fatin</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2fb;--panel:#fff;--ink:#1d1a2e;--mute:#6a6683;--line:#dcd8ee;--f:#d6336c;--m:#2f6fdd;--ok:#1f9d6b;--bad:#d9480f;--warn:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121e;--panel:#1d1a2c;--ink:#f0eefb;--mute:#a09cbd;--line:#322e4a;--f:#f06595;--m:#5c9bff;--ok:#38d39f;--bad:#ff8a5b;--warn:#f2c14e}}
:root[data-theme="dark"]{--bg:#14121e;--panel:#1d1a2c;--ink:#f0eefb;--mute:#a09cbd;--line:#322e4a;--f:#f06595;--m:#5c9bff;--ok:#38d39f;--bad:#ff8a5b;--warn:#f2c14e}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:0 20px 80px}
h1,h2,h3{line-height:1.1;margin:0}
.hero{padding:56px 0 28px}
.hero h1{font-size:clamp(40px,10vw,84px);font-weight:800;letter-spacing:-.03em}
.hero h1 .f{color:var(--f)}.hero h1 .m{color:var(--m)}
.hero p{max-width:60ch;color:var(--mute);margin:16px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px}
.chip b{font-size:19px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav a{white-space:nowrap;text-decoration:none;color:var(--mute);padding:6px 12px;border-radius:8px;font-size:15px}
nav a:hover,nav a:focus-visible{background:var(--panel);color:var(--ink);outline:2px solid var(--m)}
section{padding:48px 0 0}
h2{font-size:clamp(28px,6vw,42px);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 24px;max-width:62ch}
.legend{display:flex;gap:18px;font-size:15px;margin-bottom:14px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.take{background:var(--panel);border-left:6px solid var(--m);border-radius:4px 16px 16px 4px;padding:16px 20px;margin:0 0 16px}
.take.f{border-color:var(--f)}.take.w{border-color:var(--warn)}
.take h3{font-size:20px;margin-bottom:6px}
.take p{margin:0}
.dm{margin:0 0 22px}
.dm .t{display:flex;justify-content:space-between;gap:12px;font-weight:600;margin-bottom:6px}
.dm .t span:last-child{color:var(--mute);font-weight:400;font-size:14px;text-align:right}
.bar{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--line);gap:3px}
.bar>div{display:flex;align-items:center;color:#fff;font-weight:600;font-size:15px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);padding:0 10px;white-space:nowrap}
.bar>div.f{background:var(--f);justify-content:flex-start}
.bar>div.m{background:var(--m);justify-content:flex-end}
.g{margin:0 0 22px}
.g .t{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
.track{height:14px;border-radius:8px;background:var(--line);overflow:hidden}
.track>div{height:100%;width:0;border-radius:8px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.g .n{font-size:14px;color:var(--mute);margin-top:6px}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;margin:8px 0 4px;padding-bottom:2px;border-bottom:2px solid var(--line)}
.chart div{flex:1;border-radius:4px 4px 0 0;background:var(--m);height:0;transition:height 1s ease;min-width:0}
.chart.c div{background:var(--warn)}
.chart div.hot{background:var(--bad)}
.axis{display:flex;gap:4px;font-size:11px;color:var(--mute);text-align:center}
.axis span{flex:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.col h3{font-size:26px;margin-bottom:14px}
.col.ok h3{color:var(--ok)}.col.bad h3{color:var(--bad)}
.fl{border-top:1px solid var(--line);padding:12px 0}
.fl b{display:block;font-size:17px}
.fl .who{display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:999px;color:#fff;margin-bottom:4px}
.who.f{background:var(--f)}.who.m{background:var(--m)}
.fl p{margin:2px 0 0;font-size:15px;color:var(--mute)}
.rs{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rs>div{padding:20px;border-radius:18px;background:var(--panel)}
.rs h3{margin-bottom:10px;font-size:24px}
.ri{border-top:1px solid var(--line);padding:10px 0}
.ri .pr{display:inline-block;font-size:12.5px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 9px;margin-bottom:3px}
.ri p{margin:0;font-size:15.5px}
.label{font-size:clamp(28px,6vw,46px);font-weight:800;letter-spacing:-.02em;margin:10px 0 12px;line-height:1.1}
.rule{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.rule .no{font-size:40px;font-weight:800;color:var(--warn);line-height:1}
.rule b{display:block;font-size:19px}
.rule p{margin:3px 0 0;color:var(--mute)}
.foot{margin-top:56px;padding:18px 20px;border-radius:14px;background:var(--panel);font-size:14px;color:var(--mute)}
@media (max-width:680px){.cols,.rs{grid-template-columns:1fr}body{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.hs{display:flex;align-items:flex-end;gap:6px;height:130px;margin:10px 0 4px;border-bottom:2px solid var(--line)}
.hs div{flex:1;border-radius:6px 6px 0 0;background:var(--warn);height:0;transition:height 1s ease}
.hs div.hot{background:var(--bad)}
.hsx{display:flex;gap:6px;font-size:11px;color:var(--mute);text-align:center}
.hsx span{flex:1}
details.fg{border-top:1px solid var(--line);padding:14px 0}
details.fg:last-of-type{border-bottom:1px solid var(--line)}
details.fg summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:center}
details.fg summary::-webkit-details-marker{display:none}
details.fg summary:focus-visible{outline:2px solid var(--m);outline-offset:4px;border-radius:6px}
.fg .dt{font-weight:800}
.fg .tt{font-weight:600;line-height:1.3}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--warn)}.pips.hi i.on{background:var(--bad)}
details.ms summary .pips,details.ms .pips{visibility:hidden}
details.ms .dt{color:var(--ok)}
details.ms.st0 .dt{color:var(--f)}
.fb{padding:12px 0 4px 116px;font-size:15.5px}
.fb p{margin:0 0 10px}
.fb b{display:block;font-size:14px;color:var(--mute);font-weight:600}
.fb .lead{display:inline-block;color:#fff;font-size:13px;font-weight:600;padding:1px 10px;border-radius:999px}
.lead.f{background:var(--f)}.lead.m{background:var(--m)}.lead.b{background:var(--mute)}
.pat{padding:14px 0;border-top:1px solid var(--line)}
.pat b{display:block;font-size:18px}
.pat p{margin:3px 0 0;color:var(--mute);font-size:15.5px}
@media (max-width:680px){details.fg summary{grid-template-columns:1fr auto}details.fg .dt{grid-column:1/-1}.fb{padding-left:0}}
.st{display:inline-block;font-size:13px;font-weight:600;padding:0 9px;border-radius:999px;margin-top:5px;border:1px solid currentColor}
.st.ok{color:var(--ok)}.st.mix{color:var(--warn)}.st.bad{color:var(--bad)}.st.unk{color:var(--mute)}
.banner{background:var(--panel);border-left:6px solid var(--warn);border-radius:4px 14px 14px 4px;padding:14px 18px;margin:0 0 10px;font-size:15px}
.pl h3{font-size:24px;margin:26px 0 4px}
.pl .it{border-top:1px solid var(--line);padding:10px 0}
.pl .it b{display:block}.pl .it p{margin:2px 0 0;font-size:15px;color:var(--mute)}
.jg{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:4px 16px 16px 4px;padding:16px 20px;margin:12px 0 24px}
.jg p{margin:0 0 12px;color:var(--mute);font-size:15px}
.jg label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-weight:600;line-height:1.45}
.jg input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--m);cursor:pointer}
.jg input:focus-visible{outline:2px solid var(--m);outline-offset:3px}
#janjiBody:not([hidden]){animation:jin .5s ease}
@keyframes jin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;max-width:380px;width:100%}
.lock h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.lock p{color:var(--mute);font-size:15px;margin:0 0 16px}
.lock input{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lock input:focus-visible{outline:2px solid var(--m);outline-offset:2px}
.lock button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--m);color:#fff;cursor:pointer}
.lock button:disabled{opacity:.6;cursor:wait}
#lerr{color:var(--bad);font-size:14px;margin:10px 0 0;min-height:1.2em}
</style>
</head>
<body>
<div class="lock" id="lock"><form id="lf" autocomplete="off">
<h1>Laman dikunci</h1>
<p>Masukkan kata laluan untuk membuka.</p>
<input type="password" id="lp" placeholder="Kata laluan" autocomplete="current-password" aria-label="Kata laluan" autofocus>
<button type="submit" id="lb">Buka</button>
<div id="lerr" role="alert"></div>
</form></div>
<div id="app"></div>
